name: Build and publish

# Every push and pull request: build and run the full test suite.
# Pushes to main: publish the installable app (plus the single offline file) to GitHub Pages.
# Tags like v1.0.0: also create a GitHub release with the single offline file attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow numpy opencv-python-headless
          python -m playwright install --with-deps chromium

      - name: Build
        run: node build.js

      - name: Crypto tests
        run: node --test test/crypto.test.js

      - name: Browser tests (both builds, phone layout, accessibility, saving progress, media)
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Prepare site
        run: |
          mkdir -p site
          cp -r dist/pwa/. site/
          cp dist/tallystick.html site/tallystick.html

      - name: Upload offline file
        uses: actions/upload-artifact@v4
        with:
          name: tallystick-offline
          path: dist/tallystick.html

      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach offline file to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tallystick-offline

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum tallystick.html > tallystick.html.sha256
          gh release create "$GITHUB_REF_NAME" tallystick.html tallystick.html.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tallystick $GITHUB_REF_NAME" \
            --notes "Download tallystick.html and open it in any browser. It works offline. The .sha256 file lets you check the download is genuine."
